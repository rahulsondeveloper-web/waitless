# Single origin for the SPA, REST API, Socket.IO and media. TLS terminates in front of this
# (load balancer) or add a `listen 443 ssl` server block with certificates in production.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream waitless_api {
  server api:8000;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 6m;   # MAX_UPLOAD_MB + overhead

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location /api/ {
    proxy_pass http://waitless_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://waitless_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  location /media/ {
    proxy_pass http://waitless_api;
    expires 30d;
  }

  # Hashed bundles can be cached forever; index.html must never be cached.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
