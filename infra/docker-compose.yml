# Deployment / server use (not needed for local Windows development).
#   docker compose -f infra/docker-compose.yml --env-file backend/.env up -d --build
#   docker compose -f infra/docker-compose.yml exec api alembic upgrade head
name: waitless

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-waitless}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  api:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    env_file: ../backend/.env
    environment:
      ENVIRONMENT: production
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: "true"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file: ../backend/.env
    environment:
      ENVIRONMENT: production
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: "true"
    depends_on:
      - api

  web:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  uploads:
