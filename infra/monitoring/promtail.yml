# Ships the containers' JSON logs (LOG_JSON=true) to Loki, labelled by service; request IDs stay searchable.
server:
  http_listen_port: 9080
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.project=waitless"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            request_id: request_id
      - labels:
          level:
