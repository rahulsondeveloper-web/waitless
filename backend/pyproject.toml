[project]
name = "waitless-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "db: needs PostgreSQL (database DB_NAME_TEST); skipped when unreachable",
]
filterwarnings = ["ignore::DeprecationWarning:apscheduler.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["UP046"]  # pydantic generic models keep the explicit Generic[T] form

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # autogenerated table definitions

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters through these calls in defaults — that is the intended usage.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Cookie", "fastapi.Header", "fastapi.Body"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
